<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>medcloud2-fhir-bridge 文件</title>
    <meta
      name="description"
      content="雲端懷爾抓抓（medcloud2-fhir-bridge）的公開文件。"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #17314b;
        --muted: #607386;
        --line: #d9e5ec;
        --accent: #087f8c;
        --surface: #ffffff;
        --wash: #f3f8fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--wash);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 56px auto;
      }

      .eyebrow {
        color: var(--accent);
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      h1 { margin: 8px 0 12px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; }
      p { color: var(--muted); }

      .card {
        display: block;
        margin-top: 28px;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 34px rgb(23 49 75 / 8%);
      }

      .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
      .card strong { display: block; margin-bottom: 4px; font-size: 1.2rem; }
      .card span { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">雲端懷爾抓抓</div>
      <h1>medcloud2-fhir-bridge 文件</h1>
      <p>提供 Chrome Web Store 審查與使用者查閱的公開文件。</p>

      <a class="card" href="./privacy/">
        <strong>隱私權政策 Privacy Policy</strong>
        <span>資料類別、使用目的、資料流向、本機保存與使用者選擇。</span>
      </a>
    </main>
  </body>
</html>
